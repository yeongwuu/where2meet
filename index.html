<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>어디서 모여?</title>
  <meta name="description" content="함께 가는 사람들 취향까지 맞춘 회식 장소, 1분 안에">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="src/css/tokens.css">
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/home.css">
  <script type="module" src="src/js/home.js"></script>
</head>
<body>
  <div class="page has-tabs home">
    <!-- 홈 -->
    <header class="home-hero">
      <span class="badge badge-soft">삼일맛집DB</span>
      <h1 class="display">어디서 모여?</h1>
      <p class="home-greeting" id="greeting">함께 가는 사람들 취향까지 맞춘 회식 장소, 1분 안에</p>
    </header>

    <main class="page-body">
      <!-- 모임 만들기: 가장 중요한 일 -->
      <section class="card card-accent" aria-labelledby="new-meeting">
        <div class="accent-head">
          <span class="menu-icon">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-users"/></svg>
          </span>
          <div>
            <h2 class="heading" id="new-meeting">모임 만들기</h2>
            <p class="menu-sub" id="meeting-sub">같이 갈 사람만 고르면 취향은 알아서 모아요</p>
          </div>
        </div>
        <button type="button" class="btn-primary" id="start-meeting">모임 만들기</button>
      </section>

      <!-- 작성 중인 모임이 있을 때만 -->
      <button type="button" class="row-card" id="resume" hidden>
        <span><strong>이어서 하기</strong> · <span id="resume-label"></span></span>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg>
      </button>

      <nav class="menu-list" aria-label="더 보기">
        <button type="button" class="menu-card" data-go="restaurants">
          <span class="menu-icon">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-utensils"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">식당 둘러보기</span>
            <span class="menu-sub" id="restaurants-sub">음식·예산·룸·알레르기 대응으로 골라 보기</span>
          </span>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg>
        </button>

        <button type="button" class="menu-card" data-go="review">
          <span class="menu-icon">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-star"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">후기 남기기</span>
            <span class="menu-sub">다녀온 모임에 별점과 한마디</span>
          </span>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg>
        </button>

        <button type="button" class="menu-card" data-go="teamTaste">
          <span class="menu-icon">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-heart"/></svg>
          </span>
          <span class="menu-text">
            <span class="menu-title">우리 팀 취향</span>
            <span class="menu-sub" id="team-sub">팀의 못 먹는 것과 좋아하는 음식 한눈에</span>
          </span>
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-chevron-right"/></svg>
        </button>
      </nav>

      <p class="caption home-footnote">시연용 가상 데이터예요. 실제 식당 정보와 다를 수 있어요</p>
    </main>

    <nav class="tab-bar" aria-label="메뉴">
      <a class="tab" data-tab="meeting">
        <span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-users"/></svg></span>모임
      </a>
      <a class="tab" data-tab="people" href="#">
        <span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-book-open"/></svg></span>사람
      </a>
      <a class="tab" data-tab="start">
        <span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-user"/></svg></span>내 취향
      </a>
    </nav>
  </div>
</body>
</html>
